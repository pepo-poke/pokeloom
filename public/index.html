<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéLoom | Usage Explorer</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151c32;--line:#303b60;--text:#e9efff;--muted:#9eadd2;--accent:#56d8cb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}header{padding:22px 28px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:26px}header p{margin:4px 0;color:var(--muted)}main{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;padding:18px;max-width:1500px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}h2{margin:0 0 12px;font-size:19px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button{background:#26365e;color:var(--text);border:1px solid #44568a;border-radius:8px;padding:9px 13px;font:inherit;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.muted{color:var(--muted)}#rankList{max-height:72vh;overflow:auto;margin-top:12px}.rank{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:5px 0;background:#11182b}.rank .num{color:var(--muted);width:28px;text-align:right}.rank .name{font-weight:650}.rank .sub{margin-left:auto;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:72vh;overflow:auto;background:#0b1020;padding:12px;border-radius:8px;font-size:12px}#detailTitle{color:var(--accent)}.status{margin:10px 0;color:var(--muted)}@media(max-width:760px){main{grid-template-columns:1fr;padding:10px}#rankList{max-height:45vh}}
</style></head><body>
<header><h1>PokéLoom</h1><p>Usage Data Explorer · Pokémon Champions</p></header>
<main>
<section class="panel"><h2>ポケモンランキング</h2><div class="toolbar"><button id="loadRanking">ランキングを取得</button><button id="reloadRanking">再取得</button></div><p id="rankStatus" class="status">未取得です。ランキングを取得してください。</p><div id="rankList"></div></section>
<section class="panel"><h2 id="detailTitle">ポケモン詳細</h2><p id="detailStatus" class="status">ランキングからポケモンを選択すると、個別APIを取得します。</p><div class="toolbar"><button id="copyJson" disabled>JSONをコピー</button><button id="downloadJson" disabled>JSONを保存</button></div><pre id="json">ここにAPIレスポンスが表示されます。</pre></section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);let ranking=null,detailText="",lastPokemon=null;
const API=(path)=>fetch(path,{headers:{Accept:"application/json"}});
function pretty(x){return JSON.stringify(x,null,2)}
function nameOf(o){if(!o||typeof o!=="object")return "";for(const k of ["name","pokemonName","species","slug","pokemon"]){if(typeof o[k]==="string"&&o[k])return o[k];if(o[k]&&typeof o[k]==="object"){const n=o[k].name||o[k].en||o[k].ja;if(typeof n==="string")return n;}}return ""}
function idOf(o){for(const k of ["nationalDex","national_dex","dex","dexNo","dexNumber","pokedex","id","number","pokemonId"]){const v=o?.[k];if(Number.isInteger(v)&&v>0&&v<=2000)return v;if(typeof v==="string"&&/^\d+$/.test(v)&&+v<=2000)return +v;}for(const k of ["pokemon","species"]){if(o?.[k]&&typeof o[k]==="object"){const n=idOf(o[k]);if(n)return n;}}return null}
function formOf(o){for(const k of ["form","formId","form_id"]){if(Number.isInteger(o?.[k]))return o[k]}return 0}
function findRows(data){const arrays=[];function walk(x,depth=0){if(depth>8||!x||typeof x!=="object")return;if(Array.isArray(x)){if(x.length)arrays.push(x);x.slice(0,500).forEach(v=>walk(v,depth+1));}else Object.values(x).slice(0,300).forEach(v=>walk(v,depth+1));}walk(data);let best=[];for(const a of arrays){const rows=a.map((o,i)=>({o,i,name:nameOf(o),id:idOf(o)})).filter(r=>r.name&&r.id);if(rows.length>best.length)best=rows;}return best}
async function getRanking(){ $("loadRanking").disabled=$("reloadRanking").disabled=true;$("rankStatus").textContent="leaderboard APIを取得中…";$("rankList").replaceChildren();try{const r=await API("/api/leaderboard?format=double");const text=await r.text();if(!r.ok)throw Error("HTTP "+r.status+" "+text.slice(0,300));ranking=JSON.parse(text);const rows=findRows(ranking);$("rankStatus").textContent="取得成功。レスポンス内からポケモン候補 "+rows.length+" 件を検出（データ構造はJSON欄で確認できます）。";if(!rows.length){$("rankList").innerHTML='<p class="muted">ランキングJSONの構造からポケモン名・図鑑番号を自動抽出できませんでした。右側のJSONを確認してください。</p>'; }else{rows.forEach((row,i)=>{const b=document.createElement("button");b.className="rank";b.innerHTML='<span class="num">'+(row.o.rank??row.o.position??i+1)+'</span><span class="name"></span><span class="sub">Dex '+row.id+'</span>';b.querySelector(".name").textContent=row.name;b.addEventListener("click",()=>getPokemon(row.id,formOf(row.o),row.name));$("rankList").append(b);});}showJson(ranking);$("detailTitle").textContent="ランキングJSON";}catch(e){$("rankStatus").textContent="取得失敗: "+e.message;$("json").textContent=e.stack||String(e);}finally{$("loadRanking").disabled=$("reloadRanking").disabled=false}}
async function getPokemon(id,form,name){lastPokemon={id,form,name};$("detailTitle").textContent="#"+id+" "+name;$("detailStatus").textContent="個別APIを取得中…";$("copyJson").disabled=$("downloadJson").disabled=true;try{const r=await API("/api/pokemon/"+id+"?form="+form+"&format=double");const t=await r.text();if(!r.ok)throw Error("HTTP "+r.status+" "+t.slice(0,300));const data=JSON.parse(t);showJson(data);$("detailStatus").textContent="取得成功: /api/pokemon/"+id+"?form="+form+"&format=double (HTTP "+r.status+")";}catch(e){$("detailStatus").textContent="取得失敗: "+e.message;$("json").textContent=e.stack||String(e)}}
function showJson(data){detailText=pretty(data);$("json").textContent=detailText;$("copyJson").disabled=$("downloadJson").disabled=false}
$("loadRanking").addEventListener("click",getRanking);$("reloadRanking").addEventListener("click",getRanking);
$("copyJson").addEventListener("click",async()=>{await navigator.clipboard.writeText(detailText);$("copyJson").textContent="コピーしました";setTimeout(()=>$("copyJson").textContent="JSONをコピー",1200)});
$("downloadJson").addEventListener("click",()=>{const blob=new Blob([detailText],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=(lastPokemon?"pokemon-"+lastPokemon.id:"leaderboard")+"-double.json";a.click();URL.revokeObjectURL(u)});
</script></body></html>
