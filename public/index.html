<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéLoom | Usage Explorer</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151c32;--line:#303b60;--text:#e9efff;--muted:#9eadd2;--accent:#56d8cb;--purple:#9d8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:20px 26px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:25px}header p{margin:3px 0;color:var(--muted)}.tabs{display:flex;gap:8px;padding:12px 16px 0}.tabs button.selected{background:var(--accent);color:#08121d;border-color:var(--accent);font-weight:700}main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:15px;padding:16px;max-width:1600px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}h2{margin:0 0 10px;font-size:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button{background:#26365e;color:var(--text);border:1px solid #44568a;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.muted,.status{color:var(--muted)}.status{margin:9px 0}#rankList{max-height:80vh;overflow:auto;margin-top:10px}.rank{display:flex;gap:9px;align-items:center;width:100%;text-align:left;margin:4px 0;background:#11182b;padding:8px}.rank.active{border-color:var(--accent);background:#183044}.rank .num{color:var(--muted);width:24px;text-align:right}.rank .name{font-weight:650}.rank .sub{margin-left:auto;color:var(--muted);font-size:11px}
#detailTitle{color:var(--accent);font-size:24px}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);margin:2px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin:12px 0}.metric{background:#10172a;border:1px solid var(--line);border-radius:9px;padding:10px}.metric b{display:block;color:var(--accent);font-size:19px}.metric small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.statrow{display:grid;grid-template-columns:38px 30px 1fr;gap:7px;align-items:center;font-size:12px}.statrow .bar{height:7px;background:#26304d;border-radius:8px;overflow:hidden}.statrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--accent));border-radius:8px}.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.card{background:#10172a;border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}.card h3{font-size:14px;color:var(--accent);margin:0 0 9px}.wide{grid-column:1/-1}.data-list{display:grid;gap:7px}.entry{display:grid;grid-template-columns:minmax(100px,1fr) 42px;gap:8px;align-items:center}.entry .pct{text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}.track{height:5px;background:#26304d;border-radius:6px;margin-top:4px;overflow:hidden}.track i{display:block;height:100%;background:var(--purple)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:6px 5px;border-bottom:1px solid #26304d}.table th{color:var(--muted);font-weight:500}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#202b4b;border:1px solid #35466f;border-radius:7px;padding:5px 8px}.chip small{color:var(--accent);margin-left:5px}.raw{margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto;background:#080d1b;padding:12px;border-radius:8px;font-size:12px}
@media(max-width:850px){main{grid-template-columns:1fr;padding:9px}#rankList{max-height:35vh}.sections{grid-template-columns:1fr}.wide{grid-column:auto}.stats{grid-template-columns:1fr}}
</style></head><body>
<header><h1>PokéLoom</h1><p>Usage Data Explorer · Pokémon Champions</p></header>
<nav class="tabs"><button id="tabPokemon">ポケモンランキング</button><button id="tabTrainer">トレーナーランキング</button></nav><main><section class="panel"><h2 id="listHeading">ポケモン使用率一覧</h2><div class="toolbar"><button id="loadRanking">一覧を取得</button><button id="reloadRanking">再取得</button></div><p id="rankStatus" class="status">未取得です。</p><div id="rankList"></div></section>
<section class="panel"><div class="detail-head"><h2 id="detailTitle">ポケモン詳細</h2><div class="toolbar"><button id="copyJson" disabled>JSONコピー</button><button id="downloadJson" disabled>JSON保存</button></div></div><p id="detailStatus" class="status">一覧からポケモンを選択してください。</p><div id="visual"><p class="muted">ポケモンのデータを取得すると、ここに使用率・技・持ち物・能力・性格・努力値などを表示します。</p></div><details class="raw"><summary>生JSONを表示</summary><pre id="json">未取得</pre></details></section></main>
<script>
"use strict";
const $=id=>document.getElementById(id);let detailText="",lastPokemon=null,lastTrainer=null,activeButton=null,currentTab=localStorage.getItem("pokeloom-tab")||"pokemon",trainerData=null,pokemonIndexData=null,loadPromises={pokemon:null,trainer:null};
const API=p=>fetch(p,{headers:{Accept:"application/json"}});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=v=>Number.isFinite(+v)?(+v).toFixed(+v%1?1:0)+"%":"—";
function nameOf(o){for(const k of ["name","pokemonName","species","slug","pokemon"]){if(typeof o?.[k]==="string")return o[k];if(o?.[k]&&typeof o[k]==="object")return o[k].name||o[k].en||o[k].ja||""}return ""}
function idOf(o){for(const k of ["dex","nationalDex","national_dex","dexNo","dexNumber","pokedex","id","number","pokemonId"]){const v=o?.[k];if(Number.isInteger(v)&&v>0&&v<2000)return v}return null}
function formOf(o){return o?.form??o?.formId??o?.form_id??0}
function findRows(data){let best=[];function walk(x,d=0){if(d>7||!x||typeof x!=="object")return;if(Array.isArray(x)){let a=x.map(o=>({o,name:nameOf(o),id:idOf(o)})).filter(r=>r.name&&r.id);if(a.length>best.length)best=a;x.slice(0,500).forEach(v=>walk(v,d+1))}else Object.values(x).slice(0,200).forEach(v=>walk(v,d+1))}walk(data);return best}
function listCard(title,arr,key="name"){if(!Array.isArray(arr)||!arr.length)return "";let max=Math.max(...arr.map(x=>+x.pct||0),1);return '<section class="card"><h3>'+title+'</h3><div class="data-list">'+arr.slice(0,12).map(x=>'<div><div class="entry"><span>'+esc(x[key]??x.name??"—")+'</span><span class="pct">'+pct(x.pct)+'</span></div><div class="track"><i style="width:'+Math.min(100,(+x.pct||0)/max*100)+'%"></i></div></div>').join("")+'</div></section>'}
function chips(title,arr){if(!arr?.length)return "";return '<section class="card"><h3>'+title+'</h3><div class="chips">'+arr.slice(0,20).map(x=>'<span class="chip">'+esc(x.name)+' <small>#'+esc(x.dex??x.id??"")+'</small></span>').join("")+'</div></section>'}
function renderPokemon(d){const stats=d.base_stats||[],labels=["HP","攻撃","防御","特攻","特防","素早さ"],sum=stats.reduce((a,b)=>a+(+b||0),0),max=Math.max(...stats,1);
let html='<div class="summary"><div class="metric"><small>使用率順位</small><b>#'+esc(d.rank??"—")+'</b></div><div class="metric"><small>図鑑番号</small><b>#'+esc(d.dex??lastPokemon.id)+'</b></div><div class="metric"><small>BST</small><b>'+sum+'</b></div><div class="metric"><small>フォーマット</small><b>'+esc(d.format||"—")+'</b></div></div>';
html+='<div class="chips">'+(d.types||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div>';
if(stats.length)html+='<section class="card"><h3>種族値</h3><div class="stats">'+stats.map((v,i)=>'<div class="statrow"><span>'+labels[i]+'</span><b>'+v+'</b><div class="bar"><i style="width:'+v/max*100+'%"></i></div></div>').join("")+'</div></section>';
html+='<div class="sections">'+listCard("技（採用率）",d.moves)+listCard("持ち物",d.items)+listCard("特性",d.abilities)+listCard("性格",d.natures)+listCard("努力値配分",d.evs)+listCard("KO技",d.ko_moves)+listCard("倒された技",d.koed_by_moves)+chips("よく組む味方",d.teammates)+chips("有利な相手",d.beats)+chips("苦手な相手（カウンター）",d.counters)+'</div>';
$("visual").innerHTML=html}
async function setTab(tab){currentTab=tab;localStorage.setItem("pokeloom-tab",tab);$("tabPokemon").classList.toggle("selected",tab==="pokemon");$("tabTrainer").classList.toggle("selected",tab==="trainer");$("listHeading").textContent=tab==="pokemon"?"ポケモン使用率一覧":"トレーナーランキング";$("loadRanking").textContent=tab==="pokemon"?"ポケモン一覧を取得":"トレーナーランキングを取得";$("detailTitle").textContent=tab==="pokemon"?"ポケモン詳細":"トレーナー詳細";$("detailStatus").textContent=tab==="pokemon"?"一覧からポケモンを選択してください。":"ランキングからトレーナーを選択してください。";$("visual").innerHTML="";activeButton=null;if(tab==="pokemon"){if(pokemonIndexData)renderPokemonIndex(pokemonIndexData);else await getRanking()}else{if(trainerData)renderTrainerList(trainerData);else await getTrainerRanking()}}
function trainerName(o){for(const k of ["name","username","trainerName","player","user","displayName","handle"]){let v=o?.[k];if(typeof v==="string"&&v)return v;if(v&&typeof v==="object")return v.name||v.username||v.displayName||""}return ""}
function trainerRows(data){let best=[];function walk(x,d=0){if(d>6||!x||typeof x!=="object")return;if(Array.isArray(x)){let a=x.filter(o=>trainerName(o));if(a.length>best.length)best=a;x.slice(0,500).forEach(v=>walk(v,d+1))}else Object.values(x).slice(0,200).forEach(v=>walk(v,d+1))}walk(data);return best}
function renderTrainerList(data){$("rankList").replaceChildren();let rows=trainerRows(data);$("rankStatus").textContent="取得成功："+rows.length+"名候補（trainerデータ）";rows.forEach((o,i)=>{let b=document.createElement("button");b.className="rank";b.innerHTML='<span class="num">'+(o.rank??o.position??i+1)+'</span><span class="name"></span><span class="sub"></span>';b.querySelector(".name").textContent=trainerName(o);b.querySelector(".sub").textContent=o.rating??o.elo??o.score??"";b.onclick=()=>showTrainer(o,i,b);$("rankList").append(b)})}
function showTrainer(o,i,button){lastTrainer=o;if(activeButton)activeButton.classList.remove("active");activeButton=button;button?.classList.add("active");lastPokemon=null;detailText=JSON.stringify(o,null,2);const total=(+o.wins||0)+(+o.losses||0)+(+o.draws||0),winRate=total?(+o.wins||0)/total*100:0; $("detailTitle").textContent=o.name||("Trainer "+(i+1));$("detailStatus").textContent="トレーナーランキング · 生データから表示";$("visual").innerHTML='<div class="summary"><div class="metric"><small>ランキング</small><b>#'+esc(o.rank??"—")+'</b></div><div class="metric"><small>レーティング</small><b>'+esc(Number.isFinite(+o.rating)?(+o.rating).toFixed(1):"—")+'</b></div><div class="metric"><small>勝利</small><b>'+esc(o.wins??0)+'</b></div><div class="metric"><small>敗北</small><b>'+esc(o.losses??0)+'</b></div><div class="metric"><small>引分</small><b>'+esc(o.draws??0)+'</b></div><div class="metric"><small>対戦数</small><b>'+total+'</b></div><div class="metric"><small>勝率</small><b>'+winRate.toFixed(1)+'%</b></div></div><section class="sections"><div class="card"><h3>プロフィール</h3><div class="data-list"><div class="entry"><span>トレーナー名</span><span class="pct">'+esc(o.name||"—")+'</span></div><div class="entry"><span>国コード</span><span class="pct">'+esc(o.country??"—")+'</span></div><div class="entry"><span>言語コード</span><span class="pct">'+esc(o.lang??"—")+'</span></div><div class="entry"><span>アイコンID</span><span class="pct">'+esc(o.icon??"—")+'</span></div><div class="entry"><span>レンタル</span><span class="pct">'+(o.hasRentals?"あり":"なし")+'</span></div><div class="entry"><span>Twitter</span><span class="pct">'+esc(o.twitter||"—")+'</span></div></div></div><div class="card"><h3>勝敗内訳</h3><div class="data-list"><div class="entry"><span>勝利</span><span class="pct">'+esc(o.wins??0)+'</span></div><div class="track"><i style="width:'+(total?(+o.wins||0)/total*100:0)+'%"></i></div><div class="entry"><span>敗北</span><span class="pct">'+esc(o.losses??0)+'</span></div><div class="track"><i style="width:'+(total?(+o.losses||0)/total*100:0)+'%"></i></div><div class="entry"><span>引分</span><span class="pct">'+esc(o.draws??0)+'</span></div><div class="track"><i style="width:'+(total?(+o.draws||0)/total*100:0)+'%"></i></div></div></div></section>';$("json").textContent=detailText;$("copyJson").disabled=$("downloadJson").disabled=false}
async function getTrainerRanking(force=false){if(loadPromises.trainer)return loadPromises.trainer;if(trainerData&&!force){renderTrainerList(trainerData);return}loadPromises.trainer=(async()=>{$("loadRanking").disabled=$("reloadRanking").disabled=true;$("rankStatus").textContent="トレーナーランキング取得中…";try{let r=await API("/api/ladder?format=double"),t=await r.text();if(!r.ok)throw Error("HTTP "+r.status);trainerData=JSON.parse(t);renderTrainerList(trainerData);detailText=JSON.stringify(trainerData,null,2);$("json").textContent=detailText;$("copyJson").disabled=$("downloadJson").disabled=false}catch(e){$("rankStatus").textContent="取得失敗："+e.message}finally{$("loadRanking").disabled=$("reloadRanking").disabled=false;loadPromises.trainer=null}})();return loadPromises.trainer}
function renderPokemonIndex(data){$("rankList").replaceChildren();let rows=findRows(data);$("rankStatus").textContent="取得成功："+rows.length+"件";rows.forEach((row,i)=>{let b=document.createElement("button");b.className="rank";b.innerHTML='<span class="num">'+(i+1)+'</span><span class="name">'+esc(row.name)+'</span><span class="sub">Dex '+row.id+'</span>';b.onclick=()=>getPokemon(row.id,formOf(row.o),row.name,b);$("rankList").append(b)});$("json").textContent=JSON.stringify(data,null,2);detailText=JSON.stringify(data,null,2);$("copyJson").disabled=$("downloadJson").disabled=false}
async function getRanking(force=false){if(loadPromises.pokemon)return loadPromises.pokemon;if(pokemonIndexData&&!force){renderPokemonIndex(pokemonIndexData);return}loadPromises.pokemon=(async()=>{$("loadRanking").disabled=$("reloadRanking").disabled=true;$("rankStatus").textContent="dexindex取得中…";$("rankList").replaceChildren();try{let r=await API("/api/dexindex?format=double"),t=await r.text();if(!r.ok)throw Error("HTTP "+r.status);pokemonIndexData=JSON.parse(t);renderPokemonIndex(pokemonIndexData);$("detailTitle").textContent="ポケモン詳細"}catch(e){$("rankStatus").textContent="失敗："+e.message}finally{$("loadRanking").disabled=$("reloadRanking").disabled=false;loadPromises.pokemon=null}})();return loadPromises.pokemon}
async function getPokemon(id,form,name,button){lastTrainer=null;if(activeButton)activeButton.classList.remove("active");activeButton=button;button?.classList.add("active");lastPokemon={id,form,name};$("detailTitle").textContent="#"+id+" "+name;$("detailStatus").textContent="個別データ取得中…";$("visual").innerHTML="";$("copyJson").disabled=$("downloadJson").disabled=true;try{let r=await API("/api/pokemon/"+id+"?form="+form+"&format=double"),t=await r.text();if(!r.ok)throw Error("HTTP "+r.status);let d=JSON.parse(t);detailText=JSON.stringify(d,null,2);$("json").textContent=detailText;renderPokemon(d);$("detailStatus").textContent="取得成功 · HTTP "+r.status+" · Season "+(d.snapshot?.season??"—")+" · "+(d.snapshot?.tsp?new Date(d.snapshot.tsp*1000).toLocaleString():"");$("copyJson").disabled=$("downloadJson").disabled=false}catch(e){$("detailStatus").textContent="取得失敗："+e.message;$("json").textContent=e.stack||e}}
$("loadRanking").onclick=()=>currentTab==="pokemon"?getRanking():getTrainerRanking();$("reloadRanking").onclick=()=>currentTab==="pokemon"?getRanking(true):getTrainerRanking(true);$("tabPokemon").onclick=()=>setTab("pokemon");$("tabTrainer").onclick=()=>setTab("trainer");$("copyJson").onclick=async()=>{await navigator.clipboard.writeText(detailText);$("copyJson").textContent="コピー済";setTimeout(()=>$("copyJson").textContent="JSONコピー",1000)};$("downloadJson").onclick=()=>{let u=URL.createObjectURL(new Blob([detailText],{type:"application/json"})),a=document.createElement("a");a.href=u;let safeName=String(lastTrainer?.name||lastTrainer?.username||lastTrainer?.id||"trainer").replace(/[^\w.-]+/g,"_");a.download=currentTab==="trainer"?"trainer-"+safeName+"-double.json":(lastPokemon?"pokemon-"+lastPokemon.id:"dexindex")+"-double.json";a.click();URL.revokeObjectURL(u)};
setTab(currentTab);
</script></body></html>
