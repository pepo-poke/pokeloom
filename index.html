<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéLoom | Battle Data</title><style>
:root{color-scheme:light dark;--b:#8885;--p:#8881;--ok:#16803c;--bad:#c62828;--w:#a56800}*{box-sizing:border-box}body{max-width:950px;margin:auto;padding:24px 16px;font:16px/1.55 system-ui}h1{margin:0;font-size:2.2rem}.muted{opacity:.7}.card{border:1px solid var(--b);border-radius:12px;padding:16px;margin:16px 0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button{border:0;border-radius:8px;padding:10px 16px;background:#1769aa;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.6}input{flex:1 1 400px;min-width:0;padding:10px;border:1px solid var(--b);border-radius:8px;font:inherit}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--w)}dl{display:grid;grid-template-columns:160px 1fr;gap:8px}dd{margin:0;overflow-wrap:anywhere}pre{max-height:60vh;overflow:auto;padding:14px;border-radius:8px;background:var(--p);white-space:pre}@media(max-width:500px){dl{grid-template-columns:1fr}}
</style></head><body><h1>PokéLoom</h1><b>Battle Data Lab</b><p class="muted">ポケモン対戦データを探索・分析するためのデータラボです。</p>
<section class="card"><label for="url"><b>API endpoint</b></label><div class="row"><input id="url" type="url" value="https://silph-scope.com/api/ladder?format=double"><button id="go">取得する</button></div><p class="muted">ブラウザのCORS制限はこのページから回避できません。</p></section>
<section class="card" aria-live="polite"><h2>診断結果</h2><p id="overall">未実行</p><dl><dt>開始時刻</dt><dd id="time">—</dd><dt>HTTP status</dt><dd id="status">—</dd><dt>Content-Type</dt><dd id="type">—</dd><dt>取得時間</dt><dd id="elapsed">—</dd><dt>CORS診断</dt><dd id="cors">未実行</dd><dt>JSON解析</dt><dd id="json">未実行</dd><dt>サイズ</dt><dd id="size">—</dd></dl><p id="error" class="bad"></p></section>
<section class="card"><div class="row"><h2 style="flex:1">JSON response</h2><button id="copy" disabled>JSONをコピー</button></div><pre id="out">取得結果はここに表示されます。</pre></section>
<script>
const $=id=>document.getElementById(id);let raw="";
$("go").onclick=async()=>{let u=$("url").value.trim();try{new URL(u)}catch{$("overall").textContent="URL形式エラー";return}
$("go").disabled=true;$("copy").disabled=true;$("error").textContent="";$("out").textContent="取得中…";$("time").textContent=new Date().toLocaleString();$("overall").textContent="通信中…";let t=performance.now();
try{let r=await fetch(u,{mode:"cors",cache:"no-store"});raw=await r.text();$("status").textContent=r.status+" "+r.statusText;$("type").textContent=r.headers.get("content-type")||"不明";$("elapsed").textContent=(performance.now()-t).toFixed(0)+" ms";$("size").textContent=new TextEncoder().encode(raw).length.toLocaleString()+" bytes";$("cors").textContent="成功：レスポンスを読めました";$("cors").className="ok";
try{let d=JSON.parse(raw);raw=JSON.stringify(d,null,2);$("json").textContent="成功：有効なJSON";$("json").className="ok";$("out").textContent=raw;$("copy").disabled=false;$("overall").textContent=r.ok?"API・CORS・JSONすべてOK":"HTTPエラー "+r.status;$("overall").className=r.ok?"ok":"bad"}catch(e){$("json").textContent="JSON解析失敗";$("json").className="bad";$("out").textContent=raw;$("error").textContent=e.message;$("overall").textContent="通信成功・JSON解析失敗"}
}catch(e){$("elapsed").textContent=(performance.now()-t).toFixed(0)+" ms";$("cors").textContent="失敗：JSから読めません";$("cors").className="bad";$("json").textContent="未実行";$("overall").textContent="fetch失敗（CORSまたはネットワーク）";$("overall").className="bad";$("error").textContent=e.name+": "+e.message+"。CORSとネットワーク障害はfetchエラーだけでは区別できません。DevTools Console/Networkも確認してください。";$("out").textContent="レスポンス未取得"}finally{$("go").disabled=false}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(raw);$("copy").textContent="コピーしました";setTimeout(()=>$("copy").textContent="JSONをコピー",1300)}catch(e){$("error").textContent=e.message}};
$("url").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
</script></body></html>
